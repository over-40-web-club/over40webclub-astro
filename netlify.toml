[build]
  command = "node netlify/build-hooks/pre-build.js && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--production=false"

# Environment variables (these will be set in Netlify UI)
# SITE_URL - Site URL for canonical links

# Form settings for contact form
[forms]
  # Enable form processing
  enabled = true

# Redirect settings
# [[redirects]]
#   from = "https://over40webclub-astro.netlify.app/*"
#   to = "https://over40web.club-astro/:splat"
#   status = 302
#   force = true

# Headers for security and performance
[[headers]]
  for = "/_astro/*"
  [headers.values]
    # Hashed build assets: safe to cache forever
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # HTML and unhashed assets: always revalidate so updates show immediately
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    # Don't cache service worker
    Cache-Control = "no-cache"

# Error pages
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Build plugins for optimization
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

# Functions settings (if needed in future)
[functions]
  directory = "netlify/functions"